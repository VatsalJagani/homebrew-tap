name: Update Formula

on:
  repository_dispatch:
    types: [formula-update]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate resource blocks
        id: resources
        run: |
          pip install homebrew-pypi-poet typer rich
          RESOURCES=$(poet --resources typer --also rich)
          # Write to file to preserve formatting
          echo "$RESOURCES" > /tmp/resources.rb

      - name: Update disktree formula
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          SHA256="${{ github.event.client_payload.sha256 }}"
          REPO="${{ github.event.client_payload.repo }}"
          RESOURCES=$(cat /tmp/resources.rb)

          mkdir -p Formula

          cat > Formula/disktree.rb << FORMULA
          class Disktree < Formula
            include Language::Python::Virtualenv

            desc "Drill-down storage inspector for macOS"
            homepage "https://github.com/${REPO}"
            url "https://github.com/${REPO}/archive/refs/tags/v${VERSION}.tar.gz"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "python@3"

          $(echo "$RESOURCES" | sed 's/^/  /')

            def install
              virtualenv_install_with_resources
            end

            test do
              assert_match "disktree", shell_output("#{bin}/disktree --help")
            end
          end
          FORMULA

          # Fix indentation (remove leading spaces from heredoc)
          sed -i 's/^          //' Formula/disktree.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/disktree.rb
          git commit -m "Update disktree to ${{ github.event.client_payload.version }}"
          git push
